@switch (level()) {
    @case (1) {
        <h1>{{ text() }}</h1>
    }
    @case (2) {
        <h2>{{ text() }}</h2>
    }
    @case (3) {
        <h3>{{ text() }}</h3>
    }
    @case (4) {
        <h4>{{ text() }}</h4>
    }
    @case (5) {
        <h5>{{ text() }}</h5>
    }
    @case (6) {
        <h6>{{ text() }}</h6>
    }
}
