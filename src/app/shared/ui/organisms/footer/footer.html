<footer class="footer">
  <section class="footer__content">
    <div>
      <img [ngSrc]="imgSrc()" width="100" height="20" alt="Ícono de la app" />
    </div>

    <nav class="footer__links">
      @for (link of footerLinks(); track link.label) {
      <a [href]="link.link">
        <mat-icon>{{ link.icon }}</mat-icon>
      </a>
      }
    </nav>

    <div class="footer__copyright">
      © {{ currentYear() }} {{ author() }} — Todos los derechos reservados
    </div>
  </section>
</footer>
